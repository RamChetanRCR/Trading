[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsscan"
version = "2.0.0"
description = "News sentiment, catalyst tagging and global-cue opening bias for Indian market traders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0", "vaderSentiment>=3.3", "requests>=2.31", "PyYAML>=6.0", "rich>=13.0"]

[project.optional-dependencies]
finbert = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8.0"]

[project.scripts]
newsscan = "newsscan.cli:main"

[tool.setuptools]
packages = ["newsscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
